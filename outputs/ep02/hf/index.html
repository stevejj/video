<script>
  // 자막 가로 위치: 중심 cx, 폭 1000 안으로 클램프 (조립기와 동일 규칙)
  function placeSubs() {
    document.querySelectorAll('.sub').forEach(el => {
      const cx = parseFloat(el.dataset.cx); const W = 1080, MW = 1000;
      let fs = 74; el.style.fontSize = fs + 'px';
      while (el.offsetWidth > MW && fs > 40) { fs -= 4; el.style.fontSize = fs + 'px'; }
      const tw = el.offsetWidth;
      let x = Math.min(Math.max(cx - tw / 2, (W - MW) / 2), W - (W - MW) / 2 - tw);
      el.style.left = x + 'px';
    });
  }
  const tl = gsap.timeline({ paused: true });
  function build() {
    placeSubs();
        tl.fromTo("#c01", {"scale": 1.0, "x": 0, "y": 0}, {"scale": 1.03, "x": 0, "y": 0, "duration": 1.5, "ease": "none"}, 0.000);
    tl.fromTo("#c01-card", {x: -60, opacity: 0}, {x: 0, opacity: 1, duration: 0.25, ease: "power3.out"}, 0.000);
    tl.to("#c01-card", {opacity: 0, duration: 0.25}, 1.450);
    tl.fromTo("#c05", {"scale": 1.0, "x": 0, "y": 0}, {"scale": 1.08, "x": 0, "y": 0, "duration": 2.0, "ease": "none"}, 7.000);
    tl.to("#c05", {x: -5.0, y: 3.0, duration: 1.30, ease: "sine.inOut"}, 7.000);
    tl.fromTo("#c08-v", {scale: 0.7, opacity: 0}, {scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)"}, 13.500);
    tl.to("#c08-num", {scale: 1.35, duration: 0.08, yoyo: true, repeat: 1, onStart: () => { document.getElementById("c08-num").textContent = "4회차"; }}, 14.100);
    tl.fromTo("#c09", {"scale": 1.0, "x": 0, "y": 0}, {"scale": 1.0, "x": 0, "y": 0, "duration": 2.5, "ease": "none"}, 15.000);
    tl.to("#c09", {x: 6.0, y: 3.0, duration: 0.0417, ease: "none"}, 16.600);
    tl.to("#c09", {x: -3.6, y: 2.2, duration: 0.0417, ease: "none"}, 16.642);
    tl.to("#c09", {x: 2.4, y: -1.5, duration: 0.0417, ease: "none"}, 16.683);
    tl.to("#c09", {x: -1.5, y: -0.8, duration: 0.0417, ease: "none"}, 16.725);
    tl.to("#c09", {x: 0, y: 0, duration: 0.08}, 16.767);
    tl.fromTo("#c10", {"scale": 1.0, "x": 0, "y": 0}, {"scale": 1.05, "x": 0, "y": 0, "duration": 2.0, "ease": "none"}, 17.500);
    tl.fromTo("#c13-ring", {scale: 2, opacity: 0}, {scale: 1, opacity: 1, duration: 0.25, ease: "power3.out"}, 24.100);
    tl.fromTo("#c13-arrow", {x: 30, opacity: 0}, {x: 0, opacity: 1, duration: 0.2, ease: "back.out(3)"}, 24.300);
    tl.to("#c13-arrow", {x: 12, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut"}, 24.500);
    tl.fromTo("#c13", {"scale": 1.0, "x": 0, "y": 0}, {"scale": 1.25, "x": 0, "y": 0, "duration": 1.5, "ease": "none"}, 24.000);
    tl.fromTo("#c16", {"scale": 1.0, "x": 0, "y": 0}, {"scale": 1.04, "x": 0, "y": 0, "duration": 2.0, "ease": "none"}, 29.000);
    tl.fromTo("#c16-card", {x: -60, opacity: 0}, {x: 0, opacity: 1, duration: 0.25, ease: "power3.out"}, 29.000);
    tl.to("#c16-card", {opacity: 0, duration: 0.25}, 30.450);
    window.__timelines["main"] = tl;
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(build); } else { build(); }
</script>
